<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-size: 16px; width: 100%; }
        button:hover { background-color: #0056b3; }
        #message { margin-top: 15px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>Log a Workout</h2>
    
    <form id="workoutForm">
        <div class="form-group">
            <label for="exerciseName">Exercise Name:</label>
            <input type="text" id="exerciseName" required>
        </div>
        <div class="form-group">
            <label for="sets">Sets:</label>
            <input type="number" id="sets" required>
        </div>
        <div class="form-group">
            <label for="reps">Reps:</label>
            <input type="number" id="reps" required>
        </div>

        <button type="submit">Save Workout</button>
    </form>
    
    <div id="message"></div>
</div>

<script>
    document.getElementById('workoutForm').addEventListener('submit', function(event) {
        event.preventDefault(); // Prevents the page from reloading on submit

        // 1. Gather the data and build the JSON payload
        // IMPORTANT: The keys (exerciseName, sets, reps) MUST perfectly match the variable names in your ExerciseLog.java file!
        const workoutData = {
            exerciseName: document.getElementById('exerciseName').value,
            sets: document.getElementById('sets').value,
            reps: document.getElementById('reps').value
        };

        // 2. Send the JSON to your Spring Boot Controller
        // IMPORTANT: Change '/api/workouts' to match the exact @PostMapping route listed in your WorkoutController.java file!
        fetch('/api/workouts/log', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(workoutData)
        })
        .then(response => {
            if (response.ok) {
                document.getElementById('message').style.color = 'green';
                document.getElementById('message').innerText = 'Success! Workout saved to database.';
                document.getElementById('workoutForm').reset();
            } else {
                document.getElementById('message').style.color = 'red';
                document.getElementById('message').innerText = 'Failed to save. Check terminal for errors.';
            }
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('message').style.color = 'red';
            document.getElementById('message').innerText = 'Server error. Is Spring Boot running?';
        });
    });
</script>
</body>
</html>
